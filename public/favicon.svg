<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#040714"/>
  <!-- wireframe globe (physical world) -->
  <g stroke="#c86a3b" stroke-width="3" fill="none">
    <circle cx="18" cy="32" r="11"/>
    <ellipse cx="18" cy="32" rx="4.5" ry="11"/>
    <line x1="7" y1="32" x2="29" y2="32"/>
  </g>
  <!-- silicon chip -->
  <rect x="36" y="22" width="20" height="20" rx="4" fill="none" stroke="#4da3ff" stroke-width="3.5"/>
  <rect x="42.5" y="28.5" width="7" height="7" rx="1.5" fill="#4da3ff"/>
  <!-- bond lines -->
  <line x1="30.5" y1="28" x2="36" y2="28" stroke="#e8edf7" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="30.5" y1="36" x2="36" y2="36" stroke="#e8edf7" stroke-width="2.5" stroke-linecap="round"/>
</svg>
